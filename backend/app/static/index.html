<script>
// ============ API 层（从旧前端移植）============
var API=(location.pathname.indexOf('/legal-agent')>=0?'/legal-agent':'');
var TOKEN=localStorage.getItem('LEGAL_AGENT_TOKEN')||'dev-local-token';
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
function mdToHtml(md){
var lines=String(md||'').split('\n');
var html='',inCode=false,inUl=false,inOl=false,inQuote=false;
function closeLists(){if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}if(inQuote){html+='</blockquote>';inQuote=false}}
function inline(s){
s=s.replace(/`([^`]+)`/g,'<code style="background:#f0f0f0;padding:1px 4px;border-radius:3px;font-size:.9em">$1</code>');
s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--pri)">$1</a>');
return s;}
for(var i=0;i<lines.length;i++){
var line=lines[i];
if(line.match(/^```/)){if(inCode){html+='</code></pre>';inCode=false}else{closeLists();html+='<pre style="background:#1e2b2d;color:#e4efed;padding:12px;border-radius:6px;overflow-x:auto;font-size:12px;line-height:1.5"><code>';inCode=true}continue;}
if(inCode){html+=line+'\n';continue;}
if(line.match(/^---+$/)){closeLists();html+='<hr style="border:0;border-top:1px solid #ddd;margin:12px 0">';continue;}
if(line.match(/^###\s/)){closeLists();html+='<h4 style="font-size:14px;margin:12px 0 6px">'+inline(line.replace(/^###\s/,''))+'</h4>';continue;}
if(line.match(/^##\s/)){closeLists();html+='<h3 style="font-size:15px;margin:14px 0 8px">'+inline(line.replace(/^##\s/,''))+'</h3>';continue;}
if(line.match(/^#\s/)){closeLists();html+='<h3 style="font-size:16px;margin:14px 0 8px">'+inline(line.replace(/^#\s/,''))+'</h3>';continue;}
if(line.match(/^>\s/)){if(!inQuote){html+='<blockquote style="border-left:3px solid var(--acc);margin:8px 0;padding:6px 12px;background:var(--sf);border-radius:0 4px 4px 0">';inQuote=true}html+='<p style="margin:0">'+inline(line.replace(/^>\s/,''))+'</p>';continue;}else if(inQuote){html+='</blockquote>';inQuote=false}
if(line.match(/^\s*[-*]\s/)){if(!inUl){closeLists();html+='<ul style="margin:6px 0;padding-left:20px">';inUl=true}html+='<li style="margin:3px 0">'+inline(line.replace(/^\s*[-*]\s/,''))+'</li>';continue;}
if(line.match(/^\s*\d+\.\s/)){if(!inOl){closeLists();html+='<ol style="margin:6px 0;padding-left:20px">';inOl=true}html+='<li style="margin:3px 0">'+inline(line.replace(/^\s*\d+\.\s/,''))+'</li>';continue;}
if(line.trim()===''){closeLists();continue;}
if(!inUl&&!inOl&&!inQuote){html+='<p style="margin:6px 0;line-height:1.7">'+inline(line)+'</p>';}
else{html+=inline(line)+'<br>';}
}
closeLists();if(inCode)html+='</code></pre>';
return html;}

async function api(path,opt){
  opt=opt||{};
  var headers=Object.assign({'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},opt.headers||{});
  try{
    var r=await fetch(API+path,Object.assign({},opt,{headers:headers}));
    var t=await r.text();var d={};
    try{d=t?JSON.parse(t):{}}catch(e){d={detail:t}}
    if(!r.ok)throw Error(d.detail||('HTTP '+r.status));
    return d;
  }catch(e){throw e;}
}
function toast(msg){

// ============ 赔偿计算器 ============
function calcDamages(){
  var s=$('calcSalary'),e=$('calcEnd'),st=$('calcStart');
  if(!s||!e||!st)return;
  var salary=parseFloat(s.value)||0;
  var start=new Date(st.value),end=new Date(e.value);
  if(!start.getTime()||!end.getTime())return;
  var days=(end-start)/86400000;
  var months=days/30.44;
  var years=months/12;
  var reason=$('calcReason').value,contract=$('calcContract').value;
  var n=years<0.5?0.5:Math.ceil(years);
  var items=[];
  if(contract==='unsigned'&&months>1){
    var dm=Math.min(Math.floor(months)-1,11);
    if(dm>0)items.push(['二倍工资差额','§82·入职满1月至离职',salary*dm]);
  }
  if(reason==='illegal'){items.push(['违法解除赔偿金(2N)','§87·'+n+'×2×月工资',salary*n*2]);}
  else if(reason==='negotiate'||reason==='expire'){items.push(['经济补偿金(N)','§47·'+n+'×月工资',salary*n]);}
  var total=items.reduce(function(s,i){return s+i[2]},0);
  $('calcTotal').textContent='¥'+total.toLocaleString();
  $('calcBreakdown').innerHTML=items.map(function(i){return '<div class="cln"><div><div style="opacity:.8">'+i[0]+'</div><div style="font-size:11px;opacity:.6">'+i[1]+'</div></div><div>¥'+i[2].toLocaleString()+'</div></div>'}).join('')||'<div class="cln"><div style="opacity:.8">暂无赔偿项</div><div>¥0</div></div>';
}

    el.innerHTML=results.map(function(r){return '<div class="ri"><div style="font-size:13px;font-weight:600">'+esc(r.filename||r.title||'未命名')+'</div><div class="tm ts" style="line-height:1.6;margin-top:6px">'+esc((r.snippet||r.content||'').substring(0,200))+'</div></div>'}).join('');
  }catch(e){el.innerHTML='<div class="bd bd--d" style="padding:14px">检索失败：'+esc(e.message)+'</div>';}

async function loadContractPage(){
  try{
    var d=await api('/api/documents');
    var docs=(d.items||d||[]).filter(function(x){return true});
    var sel=$('reviewDocSelect');
    if(sel){sel.innerHTML='<option value="">请选择</option>'+docs.map(function(x){return '<option value="'+x.id+'">'+esc(x.filename||x.title)+'</option>'}).join('');}
    var c=await api('/api/review/checklists');
    var cl=(c.items||c||[]);
    var cs=$('checklistSelect');
    if(cs){cs.innerHTML=cl.map(function(x){return '<option value="'+(x.id||'')+'">'+esc(x.name||x.id||'')+'</option>'}).join('');}
  }catch(e){}
}
async function runReview(){
  var docId=$('reviewDocSelect').value,clId=$('checklistSelect').value;
  if(!docId){toast('请先选择材料');return;}
  var btn=$('reviewBtn');btn.disabled=true;btn.textContent='审查中…';
  $('reviewResult').innerHTML='<div class="tm ts" style="text-align:center;padding:40px 0">AI 审查中，请稍候…</div>';
  try{
    var body={document_id:docId};
    if(clId)body.checklist_id=clId;
    var d=await api('/api/review/contract',{method:'POST',body:JSON.stringify(body)});
    var risks=(d.risks||d.items||[]);
    var html='<div class="flex aic jcb mb16"><span class="fs">审查完成</span><span class="bd '+(risks.length>3?'bd--d':'bd--w')+'">'+risks.length+' 项风险</span></div>';
    html+=risks.map(function(r){return '<div style="border:1px solid var(--bd);border-radius:var(--rs);padding:14px;margin-bottom:10px"><div class="flex aic jcb mb8"><div class="fs ts">'+esc(r.title||r.category||'')+'</div><span class="bd '+(r.severity==='high'?'bd--d':r.severity==='medium'?'bd--w':'bd--s')+'">'+(r.severity||'')+'</span></div><div class="tm ts" style="line-height:1.7">'+esc(r.description||r.detail||r.suggestion||'')+'</div></div>'}).join('');
    if(!risks.length)html+='<div class="bd bd--s" style="padding:14px">未发现明显风险</div>';
    $('reviewResult').innerHTML=html;
  }catch(e){$('reviewResult').innerHTML='<div class="bd bd--d" style="padding:14px">审查失败：'+esc(e.message)+'</div>';}
  btn.disabled=false;btn.textContent='运行合同审查';
}
