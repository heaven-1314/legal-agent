name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install agent-core deps
        working-directory: agent-core
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build FastAPI sidecar (PyInstaller)
        working-directory: backend
        run: |
          pip install -r requirements-sidecar.txt pyinstaller
          python -c "import PyInstaller.__main__; import os; PyInstaller.__main__.run(['run_sidecar.py','--onefile','--name','legal-agent-sidecar','--distpath','dist','--workpath','/tmp/pyi-build','--add-data',os.path.join('app','data','laws.json')+os.pathsep+os.path.join('app','data')])"

      - name: Fetch Electron binary (postinstall was skipped)
        working-directory: desktop
        run: node node_modules/electron/install.js

      - name: Build
        working-directory: desktop
        run: |
          pnpm run build:main
          node esbuild-agent.mjs
          pnpm run build:ui

      - name: Package & publish
        working-directory: desktop
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
